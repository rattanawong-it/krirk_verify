# =============================================================
# Krirk Verify — production (F-OPS-02): nginx → app → postgres
# ใช้งาน (จากรากโปรเจกต์):
#   cp .env.prod.example .env.prod   # แล้วแก้ค่าให้ครบ
#   docker compose -f docker/docker-compose.prod.yml --env-file .env.prod up -d --build
# ลำดับการเริ่ม: postgres (healthy) → migrate (migration + seed ค่าตั้งต้น แล้วจบ) → app (healthy) → nginx
# คู่มือเต็ม: docs/operations/deployment.md
# =============================================================
name: krirk-verify

x-app-env: &app-env
  env_file: ../.env.prod
  environment:
    # ประกอบจากค่า POSTGRES_* เพื่อไม่ให้ตั้งรหัสผ่านสองที่แล้วไม่ตรงกัน (รหัสผ่านต้องไม่มีอักขระพิเศษของ URL)
    DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:?}?schema=public
    NODE_ENV: production
    TZ: Asia/Bangkok

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      TZ: Asia/Bangkok
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
    # ไม่เปิดพอร์ตออกนอกเครื่อง — สำรองข้อมูลผ่าน scripts/backup-db.sh (docker compose exec)

  migrate:
    image: ${APP_IMAGE:-krirk-verify}:${APP_TAG:-latest}-migrate
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrate
    <<: *app-env
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]

  app:
    image: ${APP_IMAGE:-krirk-verify}:${APP_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    <<: *app-env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks: [backend, frontend]

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    environment:
      NGINX_SERVER_NAME: ${NGINX_SERVER_NAME:?}
      TZ: Asia/Bangkok
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # ไฟล์ใน templates/ ถูกแทนค่า ${NGINX_SERVER_NAME} แล้ววางที่ /etc/nginx/conf.d/ ตอนเริ่ม container
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy
    networks: [frontend]

volumes:
  postgres_data:

networks:
  frontend:
  # postgres อยู่เฉพาะเครือข่ายภายใน — nginx เข้าถึงฐานข้อมูลไม่ได้
  backend:
    internal: true
